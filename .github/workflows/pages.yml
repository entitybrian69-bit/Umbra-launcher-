name: pages
# The gallery, published where the owner can open it on a phone.
#
# Why this is a separate workflow and not a step in `android.yml`: the gallery
# pictures are produced by the emulator job and committed to `evidence/ci/gallery/`,
# which that job pushes with `[skip ci]`. Publishing from here means a hand-run of
# this workflow republishes the page from whatever is committed, without needing an
# emulator or a ten-minute APK build.
#
# The site is one static file and the PNGs beside it: no framework, no CDN, no
# scripts. `tools/gallery_page.py` regenerates `docs/index.html` from
# `docs/gallery/` so the page cannot drift from the pictures.
on:
  push:
    branches: ['**']
    paths:
      - 'docs/gallery/**'
      - 'docs/index.html'
      - 'tools/gallery_page.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer commit wins: a page is a view of the
# repository, so there is nothing to merge.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the gallery page from the committed pictures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the page, so it cannot drift from the pictures
        run: |
          python3 tools/gallery_page.py --out docs/index.html
          # A page that names fewer pictures than are on disk is a stale page, and a
          # stale page is how a blank gallery survived six runs unnoticed.
          MISSING=0
          for f in docs/gallery/*.png; do
            base="$(basename "$f")"
            grep -q "$base" docs/index.html || { echo "::error title=pages::the page does not show $base"; MISSING=1; }
          done
          [ "$MISSING" = 0 ] || exit 1
          echo "::notice title=pages::the page shows $(ls docs/gallery/*.png | wc -l) picture(s)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
