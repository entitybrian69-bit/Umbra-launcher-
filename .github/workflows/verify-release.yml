name: verify-release
# Re-verify a published release at any time: download every asset from its public
# URL, check it against the release's own SHA256SUMS, then run the binaries.
#
# This exists because `release.yml` could not verify the first release (its
# verifier was broken when the tag was pushed, D-032), and because "is the thing
# people download still intact?" should be answerable without a new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v0.3.0-pre)'
        required: true
      commit_evidence:
        description: 'Commit RELEASE_VERIFY.txt to this branch'
        type: boolean
        default: true
  release:
    types: [released]

jobs:
  verify:
    name: Download every asset again and check it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which release to check
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "checking $TAG"

      - name: Fetch the published manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/SHA256SUMS"
          echo "manifest: $URL"
          CODE=$(curl -sSL --retry 5 --retry-delay 3 -o dist/SHA256SUMS -w '%{http_code}' "$URL")
          echo "manifest http $CODE"
          [ "$CODE" = "200" ] || { echo "::error title=manifest::SHA256SUMS returned $CODE"; exit 1; }
          cat dist/SHA256SUMS

      - name: Verify by downloading every asset from its public URL
        run: |
          bash tools/verify_release.sh "$TAG" dist RELEASE_VERIFY.txt

      - name: Run the binaries that were just downloaded
        run: |
          set -uo pipefail
          OUT=RELEASE_VERIFY.txt
          FAILED=0
          LINUX=$(ls dist/downloaded/*-linux-x64 2>/dev/null | head -1)
          WIN=$(ls dist/downloaded/*-windows-x64.exe 2>/dev/null | head -1)
          if [ -n "$LINUX" ]; then
            chmod +x "$LINUX"
            "$LINUX" > /tmp/linux-run.log 2>&1 || true
            if grep -qE "PASS: [0-9]+ checks, 0 failures" /tmp/linux-run.log; then
              echo "linux: the downloaded binary passed its self-test" | tee -a "$OUT"
              tail -3 /tmp/linux-run.log | tee -a "$OUT"
            else
              echo "linux: the downloaded binary FAILED" | tee -a "$OUT"
              tail -5 /tmp/linux-run.log | tee -a "$OUT"
              FAILED=1
            fi
          else
            echo "linux: no downloaded binary to run" | tee -a "$OUT"; FAILED=1
          fi
          if [ -n "$WIN" ]; then
            sudo apt-get install -y -qq wine64 >/dev/null 2>&1 || sudo apt-get install -y -qq wine >/dev/null 2>&1 || true
            WINE=$(command -v wine64 || command -v wine || true)
            if [ -n "$WINE" ]; then
              "$WINE" "$WIN" > /tmp/wine.log 2>&1 || true
              if grep -qE "PASS: [0-9]+ checks, 0 failures" /tmp/wine.log; then
                echo "windows: the downloaded .exe ran under wine and passed its self-test" | tee -a "$OUT"
              else
                echo "windows: the downloaded .exe did not pass under wine" | tee -a "$OUT"
                tail -5 /tmp/wine.log | tee -a "$OUT"
                FAILED=1
              fi
            else
              echo "windows: wine is unavailable, so the .exe is unproven" | tee -a "$OUT"
              FAILED=1
            fi
          fi
          grep -E "^(linux|windows|RESULT):" "$OUT" || true
          exit "$FAILED"

      - name: Commit the verification
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          cp RELEASE_VERIFY.txt "evidence/release/${TAG}.txt" 2>/dev/null || true
          git add -f RELEASE_VERIFY.txt evidence/release
          BRANCH="${GITHUB_REF_NAME}"
          case "$BRANCH" in
            v*) BRANCH=$(git branch -r --contains "$TAG^{commit}" 2>/dev/null | grep -v HEAD | sed 's|^ *origin/||' | grep -v '^main$' | head -1) ;;
          esac
          [ -n "$BRANCH" ] || BRANCH=main
          bash tools/commit_evidence.sh "ci: release verification for $TAG from run $GITHUB_RUN_ID [skip ci]" "$BRANCH"
