name: world
# Gate 6b, first half: a world the real server generated, read the way the renderer
# reads one. The server jar and the save are downloaded and written at test time and
# never enter the repository; only the readers' numbers and their agreement are.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  world:
    name: "Real server world: Anvil/NBT read twice and compared block by block"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Toolchain versions
        run: |
          uname -a
          python3 --version
          nproc
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: A synthetic world, read twice (no network, no game data)
        # The same two readers over a world generated here, so the comparison itself is
        # tested on every push even if the server download or the server run fails.
        run: |
          set -o pipefail
          mkdir -p evidence/world
          python3 tools/make_test_world.py build/world-test 2 2>&1 | tee evidence/world/synthetic.txt
          GOOSE=build/bin/goose bash tools/check_real_world.sh build/world-test build/world-test-out \
            2>&1 | tee -a evidence/world/synthetic.txt
          # And in the three other flavours the real save turned out to use, because one
          # flavour passing is what let 529 real chunks read as air:
          #   string   - a section with no properties is a list of bare names (26.3)
          #   20 states- a palette wide enough that the bit packing matters (bits 5)
          #   padded   - the pre-1.16 packing, which at 4 bits is the same bytes and at
          #              5 is not
          for flavour in "string contiguous 0" "compound contiguous 20" "compound padded 20" \
                         "id contiguous 20" "id padded 20"; do
            set -- $flavour
            out="build/world-test-$1-$2-$3"
            echo "== flavour: palette $1, packing $2, $3 states in one section"
            python3 tools/make_test_world.py "$out" 2 "$1" "$2" "$3" 2>&1 | tee -a evidence/world/synthetic.txt
            GOOSE=build/bin/goose bash tools/check_real_world.sh "$out" "$out-out" \
              2>&1 | tee -a evidence/world/synthetic.txt
          done
      - name: Every palette width a section can use, read back block for block
        # A section's palette decides its bit width: two entries fit in four bits (where
        # every packing agrees), twenty need five, forty need six -- and above four bits a
        # value runs on across a 64-bit word. A reader that gets that wrong reports almost
        # the whole section as air. The real save holds 5- and 6-bit sections, so this is
        # checked on a fixture the independent writer builds here, before any download.
        run: |
          set -o pipefail
          python3 tools/check_reader_bits.py 2>&1 | tee -a evidence/world/synthetic.txt
          grep -qF "PASS: every block of every palette width was read back" \
            evidence/world/synthetic.txt

      - name: Download the pinned server jar (never committed)
        run: |
          set -o pipefail
          mkdir -p evidence/world
          if ! tools/fetch_server.sh build/server/server.jar 2>&1 | tee build/fetch-server.log; then
            cp build/fetch-server.log evidence/world/fetch-server.log
            echo "::error title=server download::$(tail -3 build/fetch-server.log | tr '\n' ' ')"
            exit 1
          fi
          cp build/fetch-server.log evidence/world/fetch-server.log
          tail -4 build/fetch-server.log | while IFS= read -r l; do
            echo "::notice title=server::$l"; done
      - name: Java for the server, as the version JSON asks
        # Not a hard-coded major: 26.3 needs Java 25 and a hard-coded 21 made the server
        # exit at load with UnsupportedClassVersionError (class file version 69). The
        # fetch step writes what the version JSON said.
        id: java
        run: |
          set -euo pipefail
          major="$(cat build/server/java_major.txt 2>/dev/null || true)"
          if [ -z "$major" ]; then
            echo "::error title=java::the version JSON named no Java version"
            exit 1
          fi
          echo "java $major, as the version JSON asks"
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.major }}
      - name: Generate a real world with the real server
        env:
          # Run while the server is still up: Umbra reads the flushed save, and the game
          # confirms or denies each block it read.
          WORLD_HOOK: ${{ github.workspace }}/tools/compare_with_server.sh
        run: |
          set -o pipefail
          java -version 2>&1 | head -2
          if ! tools/gen_server_world.sh build/server/server.jar build/server/run \
                2>&1 | tee evidence/world/gen-world.txt; then
            echo "::error title=world generation::$(tail -3 evidence/world/gen-world.txt | tr '\n' ' ')"
            exit 1
          fi
      - name: The shape of one real chunk (structure only, no block data)
        # The first real save was read by two readers that disagreed with it: one found
        # 529 chunks and no blocks, the other raised. This prints the chunk's keys, types
        # and list lengths so the next change is made from the file, not from a guess.
        if: always()
        run: |
          set -o pipefail
          mkdir -p evidence/world
          files="$(ls build/server/run/world/dimensions/minecraft/overworld/region/*.mca \
                      build/server/run/world/region/*.mca 2>/dev/null || true)"
          [ -n "$files" ] || { echo "::error title=chunk shape::the server wrote no region file"; exit 1; }
          python3 tools/dump_nbt_shape.py $files 2>&1 | tee evidence/world/chunk-shape.txt
          echo "== the raw bytes of one palette the readers cannot read"
          python3 tools/dump_nbt_shape.py --hex $files 2>&1 | tee -a evidence/world/chunk-shape.txt
      - name: A save read while it is still being generated is refused, not compared
        # Run 43847395025 read 529 chunks and 44 states at 10:19:25; the same save after the
        # stop held 1089 chunks and 76 states. The probe then force-loaded the sample area,
        # finished its generation, and 17 of 168 coordinates "failed" against a world that
        # had moved under them. The loader now names that condition, and this proves it
        # does, on a copy of the real save with one chunk's status downgraded.
        run: |
          set -o pipefail
          rm -rf build/partial
          mkdir -p build/partial
          cp -r build/server/run/world build/partial/world
          python3 tools/downgrade_chunk_status.py build/partial/world minecraft:features
          # The downgrade must not cost a single chunk: if the rewritten record had moved
          # the ones behind it, this would read fewer than the original.
          before="$(build/umbra_worldload build/server/run/world build/partial/before.txt 1 \
                    | grep -oE 'chunks [0-9]+, non-air blocks [0-9]+' | head -1)"
          after="$(build/umbra_worldload build/partial/world build/partial/after.txt 1 \
                   2>&1 | tee build/partial/log.txt \
                   | grep -oE 'chunks [0-9]+, non-air blocks [0-9]+' | head -1)"
          echo "partial: original $before"
          echo "partial: downgraded $after"
          if [ "$before" != "$after" ]; then
            echo "::error title=partial save::downgrading one status changed the chunk count"
            exit 1
          fi
          if grep -q "chunks are not .minecraft:full. yet" build/partial/log.txt; then
            grep "not .minecraft:full" build/partial/log.txt | sed 's/^/world: /'
            echo "PASS: a partly generated save is named as such"
          else
            echo "::error title=partial save::a partly generated save was not detected"
            exit 1
          fi

      - name: Read the real world twice and compare it block by block
        run: |
          set -o pipefail
          # Radius 10, the same window the server was asked about. This used to be 3,
          # which does not even cover the probe's boxes (x -96..-30, z 64..130 is chunks
          # -6..-2 by 4..8), so the two halves of gate 6b were never looking at the same
          # ground. This read happens after the clean stop, on the settled save.
          GOOSE=build/bin/goose bash tools/check_real_world.sh build/server/run/world \
            build/world-real 10 2>&1 | tee evidence/world/read-real.txt
          grep -qF "PASS: two independent readers agree on every block" evidence/world/read-real.txt

      - name: Draw the real world with the game's own models and textures
        # The question this answers: is a world the real server generated drawn with the
        # jar's real textures and every block's own model? The jar is downloaded for it
        # and never committed, like the server jar. The picture is compared with a
        # reference at a fixed pose, and the counts are checked: a block whose blockstate
        # has no model would be drawn as nothing, which is exactly the failure that looks
        # like a picture.
        run: |
          set -o pipefail
          if ! tools/fetch_jar.sh build/jar/client.jar 2>&1 | tee build/fetch-jar.log; then
            cp build/fetch-jar.log evidence/world/fetch-jar.log
            echo "::error title=jar download::$(tail -3 build/fetch-jar.log | tr '\n' ' ')"
            exit 1
          fi
          cp build/fetch-jar.log evidence/world/fetch-jar.log
          GOOSE_STDLIB=build/goose-src/stdlib GOOSE=build/bin/goose \
            bash tools/render_world.sh build/jar/client.jar build/real.ppm 960 540 \
              evidence/world/real.png build/server/run/world 6 \
            2>&1 | tee evidence/world/real-render.txt
          python3 tools/check_render_counts.py evidence/world/real-render.txt
          python3 tools/check_world_shot.py evidence/world/real.png \
            --reference docs/reference/real_world.png --record 2>&1 | tee evidence/world/real-shot.txt
      - name: Hold Umbra's blocks to the answers the server gave while it held the world
        # The client cannot run in CI, so gate 6b's second half is met the other way the
        # brief allows: the game's own verdict on every block Umbra read out of the save
        # it wrote, taken over RCON before it stopped.
        run: |
          set -o pipefail
          rm -f evidence/world/server-blocks.txt evidence/world/server-compare.log
          cp build/server/run/server-blocks.txt evidence/world/server-blocks.txt
          cp build/server/run/compare.log evidence/world/server-compare.log
          python3 tools/check_server_blocks.py evidence/world/server-blocks.txt --min 10 \
            2>&1 | tee evidence/world/server-compare.txt
      - name: Report the numbers
        if: always()
        run: |
          for f in evidence/world/read-real.txt evidence/world/gen-world.txt; do
            [ -f "$f" ] || continue
            grep -E "^(worldload:|oracle:|chunks that|blocks in|block states|detail records|region files|PASS|FAIL)" "$f" \
              | tail -20 | while IFS= read -r l; do
                echo "::notice title=world::$l"; done
          done
      - name: Commit the numbers
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add -f evidence/world
          if [ -f docs/reference/real_world.png ]; then git add -f docs/reference/real_world.png; fi
          bash tools/commit_evidence.sh "ci: world evidence from run $GITHUB_RUN_ID [skip ci]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-evidence
          path: |
            evidence/world
            docs/reference/real_world.png
            build/fetch-server.log
            build/fetch-jar.log
