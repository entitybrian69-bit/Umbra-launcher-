name: world
# Gate 6b, first half: a world the real server generated, read the way the renderer
# reads one. The server jar and the save are downloaded and written at test time and
# never enter the repository; only the readers' numbers and their agreement are.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  world:
    name: "Real server world: Anvil/NBT read twice and compared block by block"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Toolchain versions
        run: |
          uname -a
          python3 --version
          nproc
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: A synthetic world, read twice (no network, no game data)
        # The same two readers over a world generated here, so the comparison itself is
        # tested on every push even if the server download or the server run fails.
        run: |
          set -o pipefail
          mkdir -p evidence/world
          python3 tools/make_test_world.py build/world-test 2 2>&1 | tee evidence/world/synthetic.txt
          GOOSE=build/bin/goose bash tools/check_real_world.sh build/world-test build/world-test-out \
            2>&1 | tee -a evidence/world/synthetic.txt
          # And once in the 26.3 form, where a section whose states have no properties is a
          # list of bare names: reading only the classic form is what made 529 real chunks
          # look like air.
          python3 tools/make_test_world.py build/world-test-str 2 string 2>&1 | tee -a evidence/world/synthetic.txt
          GOOSE=build/bin/goose bash tools/check_real_world.sh build/world-test-str build/world-test-str-out \
            2>&1 | tee -a evidence/world/synthetic.txt
      - name: Download the pinned server jar (never committed)
        run: |
          set -o pipefail
          mkdir -p evidence/world
          if ! tools/fetch_server.sh build/server/server.jar 2>&1 | tee build/fetch-server.log; then
            cp build/fetch-server.log evidence/world/fetch-server.log
            echo "::error title=server download::$(tail -3 build/fetch-server.log | tr '\n' ' ')"
            exit 1
          fi
          cp build/fetch-server.log evidence/world/fetch-server.log
          tail -4 build/fetch-server.log | while IFS= read -r l; do
            echo "::notice title=server::$l"; done
      - name: Java for the server, as the version JSON asks
        # Not a hard-coded major: 26.3 needs Java 25 and a hard-coded 21 made the server
        # exit at load with UnsupportedClassVersionError (class file version 69). The
        # fetch step writes what the version JSON said.
        id: java
        run: |
          set -euo pipefail
          major="$(cat build/server/java_major.txt 2>/dev/null || true)"
          if [ -z "$major" ]; then
            echo "::error title=java::the version JSON named no Java version"
            exit 1
          fi
          echo "java $major, as the version JSON asks"
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.major }}
      - name: Generate a real world with the real server
        run: |
          set -o pipefail
          java -version 2>&1 | head -2
          if ! tools/gen_server_world.sh build/server/server.jar build/server/run \
                2>&1 | tee evidence/world/gen-world.txt; then
            echo "::error title=world generation::$(tail -3 evidence/world/gen-world.txt | tr '\n' ' ')"
            exit 1
          fi
      - name: The shape of one real chunk (structure only, no block data)
        # The first real save was read by two readers that disagreed with it: one found
        # 529 chunks and no blocks, the other raised. This prints the chunk's keys, types
        # and list lengths so the next change is made from the file, not from a guess.
        if: always()
        run: |
          set -o pipefail
          mkdir -p evidence/world
          for f in build/server/run/world/dimensions/minecraft/overworld/region/*.mca \
                   build/server/run/world/region/*.mca; do
            [ -f "$f" ] || continue
            python3 tools/dump_nbt_shape.py "$f" 2>&1 | tee evidence/world/chunk-shape.txt
            break
          done
      - name: Read the real world twice and compare it block by block
        run: |
          set -o pipefail
          GOOSE=build/bin/goose bash tools/check_real_world.sh build/server/run/world \
            build/world-real 2>&1 | tee evidence/world/read-real.txt
          grep -qF "PASS: two independent readers agree on every block" evidence/world/read-real.txt
      - name: Report the numbers
        if: always()
        run: |
          for f in evidence/world/read-real.txt evidence/world/gen-world.txt; do
            [ -f "$f" ] || continue
            grep -E "^(worldload:|oracle:|chunks that|blocks in|block states|detail records|region files|PASS|FAIL)" "$f" \
              | tail -20 | while IFS= read -r l; do
                echo "::notice title=world::$l"; done
          done
      - name: Commit the numbers
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add -f evidence/world
          bash tools/commit_evidence.sh "ci: world evidence from run $GITHUB_RUN_ID [skip ci]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-evidence
          path: |
            evidence/world
            build/fetch-server.log
