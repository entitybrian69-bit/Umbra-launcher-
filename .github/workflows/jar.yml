name: jar
# Gate 6, first half: the official client jar's own model data, checked against
# itself. The jar is downloaded from Mojang at test time and is never committed;
# only the version pin, the checksum and the checker's output are.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
jobs:
  jar:
    name: "Real client jar: model data self-consistency"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Download the pinned client jar (never committed)
        run: |
          set -o pipefail
          mkdir -p evidence/jar
          if ! tools/fetch_jar.sh build/jar/client.jar 2>&1 | tee build/fetch-jar.log; then
            cp build/fetch-jar.log evidence/jar/fetch-jar.log
            echo "::error title=jar download::$(tail -3 build/fetch-jar.log | tr '\n' ' ')"
            exit 1
          fi
          cp build/fetch-jar.log evidence/jar/fetch-jar.log
          tail -4 build/fetch-jar.log | while IFS= read -r l; do
            echo "::notice title=jar download::$l"; done
      - name: Check the jar's model data against itself
        run: |
          set -o pipefail
          ls -l build/jar/client.jar
          GOOSE=build/bin/goose OUT=build/umbra_jarcheck \
            bash -c 'mkdir -p evidence/jar
                     build/bin/goose --standalone --header build/jarcheck.h -o build/jarcheck.c goose/jarcheck.goose
                     cc -O2 -o build/umbra_jarcheck platform/shared/test_main.c build/jarcheck.c platform/shared/umbra_glue.c -lm -lpthread
                     build/umbra_jarcheck build/jar/client.jar' 2>&1 | tee evidence/jar/jarcheck.txt
      - name: Parse every block model with the parser the mesher uses
        run: |-
          set -o pipefail
          mkdir -p evidence/jar
          GOOSE_STDLIB=build/goose-src/stdlib GOOSE=build/bin/goose bash tools/check_models.sh 2>&1 | tee evidence/jar/models-smoke.txt
          build/umbra_modelcheck build/jar/client.jar 2>&1 | tee evidence/jar/modelcheck.txt
          grep -qF "PASS: every block model in the jar parses" evidence/jar/modelcheck.txt
      - name: Draw the demo world with the jar's own models and textures
        run: |
          set -o pipefail
          GOOSE=build/bin/goose bash tools/render_world.sh build/jar/client.jar \
            build/world.ppm 960 540 evidence/jar/world.png \
            2>&1 | tee evidence/jar/render-world.txt
      - name: Draw a world loaded from a save with the jar's own models and textures
        # The demo world was generated to suit the renderer. This one is a save on disk, read
        # the way the game's own chunks are, and every block of it drawn from the jar: the
        # answer to "is a loaded world drawn with the jar's textures and every block's own
        # model" with a picture and a count instead of a yes.
        run: |
          set -o pipefail
          rm -rf build/save-world
          python3 tools/make_test_world.py build/save-world 2 2>&1 | tee evidence/jar/save-world.txt
          GOOSE=build/bin/goose bash tools/render_world.sh build/jar/client.jar \
            build/save.ppm 960 540 evidence/jar/save.png build/save-world 0 \
            2>&1 | tee -a evidence/jar/save-world.txt
          grep -qF "jr: PASS - a world drawn with the jar's own models and textures" \
            evidence/jar/save-world.txt
          # Every block of the save has to come from its own model: a block whose
          # blockstate had no model is drawn as nothing, which is what this counts.
          grep -E "jr: blocks drawn from a model" evidence/jar/save-world.txt
          python3 tools/check_render_counts.py evidence/jar/save-world.txt
      - name: Compare the save picture with its reference
        run: |
          set -o pipefail
          python3 tools/check_world_shot.py evidence/jar/save.png \
            --reference docs/reference/jar_save.png --record 2>&1 | tee evidence/jar/save-shot.txt
      - name: Compare the picture with its reference
        run: |
          set -o pipefail
          python3 tools/check_world_shot.py evidence/jar/world.png \
            --reference docs/reference/jar_world.png --record 2>&1 | tee evidence/jar/world-shot.txt
      - name: Report the numbers
        if: always()
        run: |
          for f in evidence/jar/jarcheck.txt evidence/jar/modelcheck.txt evidence/jar/world-shot.txt; do
            [ -f "$f" ] || continue
            grep -E "^(jar:|model:|jr:|PASS|FAILED|note:)" "$f" | tail -24 | while IFS= read -r l; do
              echo "::notice title=jar::$l"; done
          done
      - name: Commit the evidence
        if: always()
        run: |
          set -euo pipefail
          git add -f evidence/jar
          # The first run that draws a world records its picture as the reference the
          # next runs are held to, so the gate has something real to compare against.
          if [ -f docs/reference/jar_world.png ]; then git add -f docs/reference/jar_world.png; fi
          if [ -f docs/reference/jar_save.png ]; then git add -f docs/reference/jar_save.png; fi
          bash tools/commit_evidence.sh "ci: jar evidence from run $GITHUB_RUN_ID [skip ci]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-evidence
          path: |
            evidence/jar
            docs/reference/jar_world.png
            docs/reference/jar_save.png
            build/fetch-jar.log
