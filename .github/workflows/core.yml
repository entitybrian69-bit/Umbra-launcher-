name: core
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    name: Goose core tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          cmake --version | head -1
          cc --version | head -1
          python3 --version
          nproc
      - name: The workflow files themselves
        # Run 43855510033 failed in 0 seconds with zero jobs: a heredoc at column 0 inside
        # a `run: |` block ended the block scalar and the file stopped being YAML, so the
        # world job never started and nothing in the repository noticed. This checks it
        # before anything else can run.
        run: python3 tools/check_workflows.py
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Core tests (Goose -> C -> native)
        run: tools/run_tests.sh | tee build/core-tests.log
      - name: Gate self-test (a corrupted fixture must fail the gate)
        run: |
          set -o pipefail
          cp goose/test/fixtures/inflate/text.zlib /tmp/keep.zlib
          printf 'X' | dd of=goose/test/fixtures/inflate/text.zlib bs=1 seek=10 conv=notrunc status=none
          if tools/run_tests.sh > build/negative.log 2>&1; then
            echo "GATE IS BROKEN: a corrupted inflate fixture still passed"; exit 1
          fi
          echo "gate self-test passed: corruption detected"
          grep -E "FAIL" build/negative.log | head -5
          cp /tmp/keep.zlib goose/test/fixtures/inflate/text.zlib
      - name: Jar checker against a synthetic jar (no network, no game data)
        run: GOOSE=build/bin/goose tools/check_jar.sh 2>&1 | tee build/jar-check.log
      - name: Draw the demo world from a synthetic jar (the same path, no network)
        # The real jar is drawn in the jar workflow; this is the same binary over a
        # jar that is generated here, so the whole path - blockstates, models, atlas,
        # mesh, pixels - runs on every push and on a machine with no network.
        run: |
          set -o pipefail
          python3 tools/gen_fake_jar.py build/fake-client.jar >/dev/null
          GOOSE=build/bin/goose bash tools/render_world.sh build/fake-client.jar \
            build/world-fake.ppm 640 360 build/world-fake.png 2>&1 | tee build/render-fake.log
          python3 tools/check_world_shot.py build/world-fake.png 2>&1 | tee -a build/render-fake.log
      - name: The game-files flow, checked without a network
        # The "get game files" screen decides three things in Goose -- which version
        # is pinned, what a downloaded file has to prove, and what the screen says in
        # each state. The first two are checked against a manifest shaped like
        # Mojang's own and against two real files: a jar that is deliberately not the
        # pinned one, and (when this job has it) the pinned one. The sha1 itself is
        # checked against the published vectors by the core suite (sha1_test.goose).
        run: |
          set -o pipefail
          python3 tools/make_test_manifest.py build/manifest.json build/version.json
          python3 tools/gen_fake_jar.py build/fake-client.jar > /dev/null
          build/bin/goose build goose/gamefiles_check.goose -o build/gamefiles_check > /dev/null
          build/gamefiles_check build/manifest.json build/version.json - build/fake-client.jar \
            2>&1 | tee build/gamefiles.txt
          grep -q "^PASS gamefiles" build/gamefiles.txt
      - name: Compile-check the shared C without the NDK (both branches)
        run: GOOSE=build/bin/goose tools/gen_core.sh && bash tools/check_c.sh
      - name: Commit the numbers
        # Artifacts and job logs cannot be read from the machine that drives this
        # project, so the evidence goes into the branch (D-016).
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p evidence/ci
          {
            echo "host: $(uname -m)"
            echo "compiler: $(cc --version | head -1)"
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo
            tail -20 build/core-tests.log
            echo
            grep -E "^(jr:|==|PASS|FAIL)" build/render-fake.log | tail -14
            echo
            echo "== the game-files flow =="
            grep -E "^(gamefiles:|PASS|FAIL)" build/gamefiles.txt | tail -12
          } > evidence/ci/core-tests-x86_64.txt
          git add -f evidence/ci
          bash tools/commit_evidence.sh "ci: x86_64 core-test evidence from run $GITHUB_RUN_ID [skip ci]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-logs
          path: |
            build/core-tests.log
            build/negative.log
            build/jar-check.log

  core-tests-arm64:
    # Gate 4 on ARM. The x86_64 job proves the code; this one proves the same
    # code on the architecture phones actually run. It does NOT execute the
    # Android arm64 .so: that is a different build (NDK clang, bionic, no libc
    # from the host) and it is only compiled, never run, by the android job.
    name: Goose core tests (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          uname -m
          cmake --version | head -1
          cc --version | head -1
          nproc
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Core tests (Goose -> C -> native, arm64)
        run: GOOSE=build/bin/goose tools/run_tests.sh 2>&1 | tee build/arm64-tests.log
      - name: Publish the numbers
        if: always()
        run: |
          grep -E "^PASS " build/arm64-tests.log | while IFS= read -r l; do
            echo "::notice title=arm64::$l"; done
          tail -3 build/arm64-tests.log | while IFS= read -r l; do
            echo "::notice title=arm64::$l"; done
      - name: Commit the numbers
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p evidence/ci
          {
            echo "host: $(uname -m)"
            echo "compiler: $(cc --version | head -1)"
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "note: this is the host test suite on ARM, not the Android arm64 .so"
            echo
            tail -20 build/arm64-tests.log
          } > evidence/ci/core-tests-arm64.txt
          git add -f evidence/ci
          bash tools/commit_evidence.sh "ci: arm64 core-test evidence from run $GITHUB_RUN_ID [skip ci]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-test-logs
          path: build/arm64-tests.log
