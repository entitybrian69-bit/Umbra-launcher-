name: android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release from this run'
        type: boolean
        default: false

jobs:
  apk:
    name: Build APK (arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain versions
        run: |
          java -version 2>&1 | head -2
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          cmake --version | head -1

      - name: JDK 21 (Gradle 8.11 and AGP 8.7 do not run on the image's default JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The signatures the native code looks UmbraNet's methods up by have to name
      # them exactly. A wrong descriptor is not a compile error in C: on run
      # 43956343069 one (String[] written as String) cost the whole Java bridge --
      # GetStaticMethodID returned NULL and the app said "no Java network class in
      # this APK" on an APK that has the class. This runs before the build so it
      # costs a minute rather than twenty.
      - name: The Java bridge's signatures, checked against the Java source
        run: python3 tools/check_jni_signatures.py | tee evidence-jni.txt

      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh

      - name: Generate the Goose core as C
        run: GOOSE=build/bin/goose tools/gen_core.sh

      - name: Report and pick the NDK
        run: |
          echo "installed NDKs:"
          ls "$ANDROID_HOME/ndk" || true
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            echo "no NDK installed; installing with sdkmanager"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "ndk;27.2.12479018"
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "using NDK at $NDK"
          echo "UMBRA_NDK_VERSION=$(basename "$NDK")" >> "$GITHUB_ENV"
          ls "$NDK" | head -5

      - name: Set build metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=0.1.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "UMBRA_GIT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Gradle assembleRelease
        working-directory: android
        env:
          GOOSE: ${{ github.workspace }}/build/bin/goose
        run: |
          set -o pipefail
          chmod +x ../tools/gen_core.sh
          # Dependency resolution flakes: run 43690301844 failed to fetch
          # kotlin-stdlib-jdk8 from Maven Central with nothing else wrong. Two
          # attempts, the second with refreshed dependencies, and the log tail
          # goes out as annotations because job logs are not readable here.
          args=(--no-daemon --stacktrace)
          attempt=1
          while :; do
            if gradle assembleRelease "${args[@]}" > /tmp/gradle.log 2>&1; then
              break
            fi
            if [ "$attempt" -ge 2 ]; then
              { grep -A15 "What went wrong" /tmp/gradle.log | head -30
                grep -nE "error:|undefined reference|FAILED|Could not resolve|not found" /tmp/gradle.log | head -25
              } | while IFS= read -r line; do echo "::error title=gradle::${line//\%/%25}"; done
              exit 1
            fi
            echo "::warning title=gradle::attempt $attempt failed; retrying with refreshed dependencies"
            attempt=$((attempt + 1))
            args+=(--refresh-dependencies)
            sleep 10
          done
          tail -12 /tmp/gradle.log
          echo "::notice title=gradle::assembleRelease succeeded on attempt $attempt"
          echo "::notice title=gradle::assembleRelease succeeded"

      - name: Locate the APK and hash it
        id: apk
        run: |
          set -e
          echo "== outputs tree =="
          find android/app/build -name '*.apk' | head -20 || true
          echo "== native libraries on disk =="
          find android/app/build -name 'libumbra.so' | tee natives.txt || true
          [ -s natives.txt ] || { echo "::error title=native::no libumbra.so was built"; exit 1; }
          APK=$(find android -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error title=apk::no APK produced by gradle"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -l "$APK"
          sha256sum "$APK" | tee apk.sha256
          echo "::notice title=apk-sha256::$(cat apk.sha256)"

      - name: Gate 2 - APK integrity
        run: |
          set -e
          APK="${{ steps.apk.outputs.apk }}"
          echo "== unzip -t =="
          unzip -t "$APK" | tail -2
          echo "== aapt2 dump badging =="
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -8
          # The key lines go out as annotations: the job log is not readable
          # from the environment that drives this project, the check-run API is.
          printf '%s\n' "$BADGING" | grep -m1 '^package:' | while IFS= read -r l; do
            echo "::notice title=apk-package::${l//\%/%25}"; done
          printf '%s\n' "$BADGING" | grep -m1 'native-code' | while IFS= read -r l; do
            echo "::notice title=apk-abis::${l//\%/%25}"; done
          printf '%s\n' "$BADGING" | grep -m1 'sdkVersion' | while IFS= read -r l; do
            echo "::notice title=apk-sdk::${l//\%/%25}"; done
          echo "== apksigner verify =="
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SIGNED="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNED" | head -12
          printf '%s\n' "$SIGNED" | grep -m1 'Verified using' | while IFS= read -r l; do
            echo "::notice title=apk-signature::${l//\%/%25}"; done
          # The game-files screen's Java (org.umbra.client.UmbraNet) has to be in the
          # APK, with the activity the manifest names, or a phone shows the screen and
          # neither button works. Checked as a file, because a missing class is exactly
          # what an APK can look complete without.
          python3 tools/check_apk_java.py "$APK"
          echo "== native libraries per ABI =="
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86_64)/libumbra\.so' || {
            echo "missing a native library for an ABI"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: umbra-apk
          path: |
            ${{ steps.apk.outputs.apk }}
            apk.sha256

  emulator:
    name: Emulator smoke test + screenshot
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: umbra-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm (the emulator will be slow)"

      # The smoke test annotates every phase as it goes, so its result can be
      # read from the check-run API even when the job log cannot be downloaded.
      - name: The client jar, for the on-device atlas check (never committed)
        # The same jar the other gates use, downloaded here so the app on the emulator
        # can be run with the game's own textures and models. It is pushed to the
        # device and deleted; it never enters the repository.
        run: |
          if ! tools/fetch_jar.sh build/jar/client.jar; then
            rm -f build/jar/client.jar
            echo "::warning title=jar::download failed; the on-device atlas check is skipped"
          fi
          ls -l build/jar/client.jar || true

      # A real save, generated by the real server, so the world phase can open a world
      # the *game* generated rather than one this project made up. It costs about three
      # minutes and it is the only way question (c) gets a device answer: a fixture world
      # proves the reader, and a world the server wrote proves the phone.
      #
      # The server asks the version JSON for a Java major, and that number moves: 26.3
      # wants 25. world.yml reads build/server/java_major.txt and installs what it says;
      # this workflow used to compare it against a hard-coded 21 and skip with a warning
      # when they differed, which is why run 44248454923 built the APK, skipped the world
      # phase and passed. The fetch step now records the major as an output and the JDK is
      # installed from it, exactly as world.yml does.
      - name: Fetch the pinned server jar (never committed)
        id: serverfetch
        run: |
          set -o pipefail
          mkdir -p build/world
          if ! tools/fetch_server.sh build/server/server.jar > build/world/fetch-server.log 2>&1; then
            echo "::warning title=world::the server jar could not be fetched; the world phase will skip"
            tail -20 build/world/fetch-server.log || true
            exit 0
          fi
          major="$(cat build/server/java_major.txt 2>/dev/null || true)"
          echo "server needs java ${major:-unknown}, as its version JSON asks"
          [ -n "$major" ] && echo "major=$major" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/setup-java@v4
        if: steps.serverfetch.outputs.major != ''
        with:
          distribution: temurin
          java-version: ${{ steps.serverfetch.outputs.major }}

      - name: A real world for the on-device world import (never committed)
        if: steps.serverfetch.outputs.major != ''
        env:
          # Force the window the phone will open to finish generating before the server
          # saves and stops. Without this the save holds proto-chunks: valid region files,
          # every palette air, Status not minecraft:full. Run 44253779192 opened 25 of
          # those and got no blocks -- which the import then refused, correctly.
          WORLD_HOOK: ${{ github.workspace }}/tools/gen_window_hook.sh
        run: |
          set -o pipefail
          mkdir -p build/world
          java -version 2>&1 | head -2
          if ! tools/gen_server_world.sh build/server/server.jar build/server/run > build/world/gen-world.log 2>&1; then
            # The step's own log is not always readable afterwards through the API, so the
            # reason is put in an annotation too: an annotation is the one thing the run
            # record always keeps.
            WHY="$(grep -E '^window: |^ERROR|^WARNING' build/world/gen-world.log 2>/dev/null | tail -6 | tr '\n' ' ' | cut -c1-900)"
            echo "::error title=world::no world for the phone: ${WHY:-no reason in gen-world.log}"
            tail -40 build/world/gen-world.log || true
            mkdir -p evidence/ci
            cp build/world/gen-world.log evidence/ci/world-gen.log 2>/dev/null || true
            cp build/server/run/server.log evidence/ci/server.log 2>/dev/null || true
            exit 1
          fi
          # What the settling hook said, where it survives: the step log was unreadable
          # after run 44262980478 and these lines are the whole question.
          echo "== the settling hook's verdict"
          cat evidence/ci/world-window.log 2>/dev/null || echo "(the hook wrote no verdict)"
          if ! grep -q "^window: PASS" evidence/ci/world-window.log 2>/dev/null; then
            echo "::error title=world::the save was not settled before the phone got it; see evidence/ci/world-window.log"
            exit 1
          fi
          # The region files, wherever the version put them. `ls` with two globs fails if
          # either matches nothing, and under `set -e` with pipefail that killed this step
          # at the assignment -- one of the two layouts always matches nothing, so the
          # step could only ever fail, which is why run 44250373572 went red here with no
          # message. `find` has no such opinion.
          # `*/region/*.mca` and nothing else. A save also has `entities/r.x.z.mca` files
          # with the same names -- and run 44251941145 zipped those instead: the phone
          # opened "25 chunks, 600 states, 0 non-air blocks, all not full", which is exactly
          # what entity NBT looks like to a chunk reader. Same names, different format, and
          # the import could not tell them apart because it never had to.
          mapfile -t ALL < <(find build/server/run/world -path '*/region/*.mca' -type f 2>/dev/null | sort)
          echo "== region files written: ${#ALL[@]}"
          printf '%s\n' "${ALL[@]:-}" | head -8
          if [ "${#ALL[@]}" -eq 0 ]; then
            echo "::error title=world::the server wrote no region files, so there is no world to hand the phone"
            tail -30 build/world/gen-world.log || true
            exit 1
          fi
          # A save's regions around the origin: the app opens a window of 25 chunks around
          # the world's spawn, and the spawn is in the region holding chunk 0,0. Four of
          # them, preferring r.0.0 and its neighbours.
          # Read the save with the project's own world reader *before* the phone gets it.
          # That reader has been compared block for block against the real server on every
          # push for weeks, so if it says the window has no blocks, the save has no blocks
          # and the phone was never the problem. Two runs in a row went red at the phone
          # and left this question open because nothing asked it here.
          echo "== what the reader that the world gate trusts says about this save"
          mkdir -p build/diag
          if [ ! -x build/umbra_worldload ] && [ -x build/bin/goose ]; then
            echo "(building the reader: the world gate's own, not a second copy)"
            # The same two commands tools/check_real_world.sh runs, so the reader is the
            # one the world gate uses and not a second copy of the logic.
            GOOSE_STDLIB="${GOOSE_STDLIB:-$GITHUB_WORKSPACE/build/goose-src/stdlib}" \
              build/bin/goose --standalone -o build/worldload.c goose/worldload.goose > /dev/null 2>&1 \
              && cc -O2 -o build/umbra_worldload build/worldload.c platform/shared/umbra_glue.c \
                   -lm -lpthread > /dev/null 2>&1 || true
          fi
          ls -l build/umbra_worldload 2>/dev/null || echo "(the reader was not built)"
          if [ -x build/umbra_worldload ]; then
            build/umbra_worldload build/server/run/world build/diag/dump.txt 2 \
              --incomplete-ok > build/diag/read.log 2>&1 || true
            grep -E "^total|^chunk (-?[0-9]+\.?)+ -?[0-9]" build/diag/dump.txt 2>/dev/null | head -4
            grep -E "^total" build/diag/dump.txt || echo "(no total line: the reader could not read it)"
            tail -5 build/diag/read.log 2>/dev/null || true
          else
            echo "(build/umbra_worldload is not built in this job; skipping the host read)"
          fi
          # The server's own account of the chunks it wrote, which is what the hook asks
          # for and what the import disagrees with.
          cp build/server/run/server.log evidence/ci/server.log 2>/dev/null || true
          grep -cE "Chunk (loaded|saved)" evidence/ci/server.log 2>/dev/null || true
          tail -6 evidence/ci/server.log 2>/dev/null || true

          REGIONS=()
          for f in "${ALL[@]}"; do
            case "$(basename "$f")" in
              r.0.0.mca|r.-1.0.mca|r.0.-1.mca|r.-1.-1.mca) REGIONS+=("$f") ;;
            esac
          done
          if [ "${#REGIONS[@]}" -eq 0 ]; then
            REGIONS=("${ALL[@]:0:4}")
          fi
          echo "== the regions this run hands the phone: ${#REGIONS[@]}"
          printf '%s\n' "${REGIONS[@]}"
          python3 tools/zip_world.py build/world/world.zip "${REGIONS[@]}"
          ls -l build/world/world.zip
          echo "UMBRA_WORLD_ZIP=$GITHUB_WORKSPACE/build/world/world.zip" >> "$GITHUB_ENV"
          # So the smoke script can tell "this run was given no save" (a skip) from "this
          # run built a save but did not receive it" (a defect). See its world phase.
          echo "UMBRA_WORLD_EXPECTED=1" >> "$GITHUB_ENV"

      - name: Install, launch, self test, soak
        env:
          UMBRA_JAR_FILE: ${{ github.workspace }}/build/jar/client.jar
          # UMBRA_WORLD_ZIP comes from $GITHUB_ENV, which the step above writes. Do *not*
          # map it here as `${{ env.UMBRA_WORLD_ZIP }}`: that expression is evaluated
          # before any step runs, so it is empty, and a mapping with an empty value
          # *overrides* the inherited variable with "". That is why run 44246764403
          # printed "UMBRA_WORLD_ZIP is empty" and skipped the phase while the step that
          # builds the world had succeeded: the world was built and then hidden from the
          # script that needed it. A step's `env:` inherits $GITHUB_ENV anyway, so the
          # variable arrives on its own.
          WORLD_HOOK: ""
          WORLD_WAIT: "300"
        run: |
          chmod +x tools/emulator_smoke.sh
          tools/emulator_smoke.sh

      - name: Screenshot gate (fresh, non-blank, similar to the reference)
        run: python3 tools/check_screenshot.py shot1.png shot2.png --reference docs/reference/emulator_home.png

      # Evidence has to travel back through git: job logs and artifact
      # downloads are both unavailable to the environment that drives this
      # project, and a screenshot nobody can look at proves nothing.
      - name: Commit the evidence to the branch
        if: always()
        run: |
          mkdir -p evidence/ci
          # Everything the smoke test wrote, whatever it got as far as doing.
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in
              *.png|*.txt|*.log) cp -f "$f" evidence/ci/ || true ;;
            esac
          done
          rm -f evidence/ci/logcat-full.txt.tmp
          {
            echo "run: $GITHUB_RUN_ID"
            echo "attempt: $GITHUB_RUN_ATTEMPT"
            echo "commit: $GITHUB_SHA"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk: $(sha256sum umbra.apk 2>/dev/null | cut -d' ' -f1)"
          } > evidence/ci/run.txt
          # Trim the noisiest files so the repository does not grow unbounded.
          [ -f evidence/ci/logcat-full.txt ] && tail -c 400000 evidence/ci/logcat-full.txt > evidence/ci/logcat-full.tmp && mv evidence/ci/logcat-full.tmp evidence/ci/logcat-full.txt || true
          git add -f evidence/ci
          # run.txt always changes, so this run must produce a commit; if it does
          # not, that is a bug in this step and it must be visible, not silent.
          REQUIRE_EVIDENCE=1 bash tools/commit_evidence.sh "ci: emulator evidence from run $GITHUB_RUN_ID [skip ci]"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            shot1.png
            shot2.png
            shot3.png
            shot4.png
            logcat-umbra.txt
            logcat-umbra2.txt
            logcat-full.txt
            meminfo.txt
            emulator.log
            logcat-umbra-bench.txt
