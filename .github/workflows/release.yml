name: release
# Gate 7: publish, then prove the published bytes by downloading them again.
#
# The job that publishes is not the job that verifies: verification fetches every
# asset from its public URL, requires HTTP 200, and compares the SHA-256 with the
# one just built. The result is committed as RELEASE_VERIFY.txt, because job logs
# are not readable from the environment that drives this project.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

jobs:
  apk:
    name: Build the APK for the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Generate the Goose core as C
        run: GOOSE=build/bin/goose tools/gen_core.sh
      - name: Compile-check the shared C (both branches)
        run: bash tools/check_c.sh
      - name: Report and pick the NDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "ndk;27.2.12479018"
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "using NDK at $NDK"
          echo "UMBRA_NDK_VERSION=$(basename "$NDK")" >> "$GITHUB_ENV"
      - name: Set build metadata
        run: echo "UMBRA_GIT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Gradle assembleRelease
        working-directory: android
        env:
          GOOSE: ${{ github.workspace }}/build/bin/goose
        run: |
          set -o pipefail
          chmod +x ../tools/gen_core.sh
          gradle assembleRelease --no-daemon --stacktrace > /tmp/gradle.log 2>&1 || {
            { grep -A15 "What went wrong" /tmp/gradle.log | head -30
              grep -nE "error:|undefined reference|FAILED" /tmp/gradle.log | head -25
            } | while IFS= read -r line; do echo "::error title=gradle::${line//\%/%25}"; done
            exit 1
          }
          tail -6 /tmp/gradle.log
      - name: Collect the APK
        run: |
          set -e
          APK=$(find android -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error title=apk::gradle produced no APK"; exit 1; }
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp "$APK" "dist/umbra-${TAG#v}-arm64.apk"
          (cd dist && sha256sum *.apk | tee SHA256SUMS)
          file "dist/umbra-${TAG#v}-arm64.apk" || true
          echo "::notice title=apk::$(cd dist && sha256sum *.apk)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*

  pc:
    name: Build the PC binaries for the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Linux x64
        run: GOOSE=build/bin/goose CC=gcc OUT=build/pc/umbra_headless tools/build_pc.sh
      - name: Windows x64 (mingw-w64)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 >/dev/null
          mkdir -p build/gen
          build/bin/goose --standalone --header build/gen/umbra_core.h -o build/gen/umbra_core.c goose/main.goose
          x86_64-w64-mingw32-gcc -O2 -o build/umbra-windows-x64.exe platform/pc/headless_main.c \
            build/gen/umbra_core.c platform/shared/umbra_glue.c -Ibuild/gen -Iplatform/shared -lm -lpthread
      - name: Collect the binaries and run the Linux one
        run: |
          set -e
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp build/pc/umbra_headless "dist/umbra-${TAG#v}-linux-x64"
          cp build/umbra-windows-x64.exe "dist/umbra-${TAG#v}-windows-x64.exe"
          chmod +x dist/*
          (cd dist && sha256sum * | grep -v SHA256SUMS > SHA256SUMS && cat SHA256SUMS)
          echo "== the Linux binary, run from the release directory =="
          "dist/umbra-${TAG#v}-linux-x64" | tail -3
          echo "== the Windows binary, under wine =="
          sudo apt-get install -y -qq wine64 >/dev/null 2>&1 || sudo apt-get install -y -qq wine >/dev/null 2>&1
          if command -v wine64 >/dev/null || command -v wine >/dev/null; then
            WINE=$(command -v wine64 || command -v wine)
            "$WINE" "dist/umbra-${TAG#v}-windows-x64.exe" > /tmp/wine.log 2>&1 || true
            tail -4 /tmp/wine.log
            grep -q "PASS: 31 checks, 0 failures" /tmp/wine.log \
              || { echo "::error title=windows::the released .exe did not pass its self-test under wine"; exit 1; }
            echo "::notice title=windows::the released .exe ran under wine and passed 31 checks"
          else
            echo "::error title=windows::no wine available, so the .exe is unproven"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-pc
          path: dist/*

  publish-and-verify:
    name: Publish, then download every asset again and check it
    needs: [apk, pc]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Collect the assets
        run: |
          set -e
          mkdir -p dist
          cp assets/release-apk/* dist/
          cp assets/release-pc/* dist/
          rm -f dist/SHA256SUMS
          ls -l dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Which branch holds this release's evidence: the first remote branch
          # that contains the tag and is not the default branch, else the default
          # branch. Deciding it here keeps a session branch name out of the repo.
          BRANCH=$(git branch -r --contains "$TAG^{commit}" 2>/dev/null \
                   | grep -v 'HEAD' | sed 's|^ *origin/||' \
                   | grep -v "^${{ github.event.repository.default_branch }}$" | head -1)
          [ -n "$BRANCH" ] || BRANCH="${{ github.event.repository.default_branch }}"
          echo "EVIDENCE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "evidence branch: $BRANCH"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES=/tmp/notes.md
          {
            echo "Umbra $TAG — a pre-release. It installs on a phone and draws a world;"
            echo "it is not Minecraft and it cannot open a world yet."
            echo
            sed 's/^/  /' docs/PHONE_TEST.md | sed 's/^  //'
            echo
            echo "Built by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "$NOTES"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release that already exists is added to, never replaced: a working
            # download must never be swapped for a broken one.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Umbra $TAG (pre-release)" \
              --notes-file "$NOTES" \
              --prerelease
          fi
      - name: Verify by downloading every asset from its public URL
        run: |
          set -uo pipefail
          FAILED=0
          OUT=RELEASE_VERIFY.txt
          {
            echo "release verification"
            echo "tag: $TAG"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > "$OUT"
          while IFS= read -r line; do
            SUM=$(echo "$line" | cut -d' ' -f1)
            NAME=$(echo "$line" | cut -d' ' -f2- | sed 's/^\*//')
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$NAME"
            CODE=$(curl -sSL -o "/tmp/dl-$NAME" -w '%{http_code}' "$URL" || echo 000)
            GOT=$(sha256sum "/tmp/dl-$NAME" 2>/dev/null | cut -d' ' -f1)
            SIZE=$(stat -c%s "/tmp/dl-$NAME" 2>/dev/null || echo 0)
            if [ "$CODE" = "200" ] && [ "$GOT" = "$SUM" ]; then
              RESULT="OK"
            else
              RESULT="MISMATCH"
              FAILED=1
            fi
            {
              echo "asset: $NAME"
              echo "  url: $URL"
              echo "  http: $CODE"
              echo "  size: $SIZE bytes"
              echo "  sha256: $GOT"
              echo "  expected: $SUM"
              echo "  result: $RESULT"
            } | tee -a "$OUT"
            echo "::notice title=verify-$NAME::$RESULT http $CODE sha256 $GOT ($SIZE bytes)"
          done < dist/SHA256SUMS
          {
            echo
            if [ "$FAILED" = 0 ]; then
              echo "RESULT: PASS - every asset was re-downloaded and matched"
            else
              echo "RESULT: FAIL - at least one asset did not match"
            fi
          } | tee -a "$OUT"
          exit "$FAILED"
      - name: Commit the verification to the default branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "umbra ci"
          git config user.email "ci@umbra.invalid"
          mkdir -p evidence/release
          cp RELEASE_VERIFY.txt "evidence/release/${TAG}.txt" 2>/dev/null || true
          cp RELEASE_VERIFY.txt RELEASE_VERIFY.txt 2>/dev/null || true
          git add -f RELEASE_VERIFY.txt evidence/release
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "ci: release verification for $TAG from run $GITHUB_RUN_ID [skip ci]"
          git pull --rebase origin "$EVIDENCE_BRANCH" || true
          git push origin "HEAD:$EVIDENCE_BRANCH"
