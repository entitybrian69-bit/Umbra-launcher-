name: release
# Gate 7: publish, then prove the published bytes by downloading them again.
#
# The job that publishes is not the job that verifies: verification fetches every
# asset from its public URL, requires HTTP 200, and compares the SHA-256 with the
# one just built. The result is committed as RELEASE_VERIFY.txt, because job logs
# are not readable from the environment that drives this project.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

jobs:
  apk:
    name: Build the APK for the release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Generate the Goose core as C
        run: GOOSE=build/bin/goose tools/gen_core.sh
      - name: Compile-check the shared C (both branches)
        run: bash tools/check_c.sh
      - name: Report and pick the NDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "ndk;27.2.12479018"
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "using NDK at $NDK"
          echo "UMBRA_NDK_VERSION=$(basename "$NDK")" >> "$GITHUB_ENV"
      - name: Set build metadata
        run: echo "UMBRA_GIT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Gradle assembleRelease
        working-directory: android
        env:
          GOOSE: ${{ github.workspace }}/build/bin/goose
        run: |
          set -o pipefail
          chmod +x ../tools/gen_core.sh
          # Dependency resolution flakes: run 43690301844 failed to fetch
          # kotlin-stdlib-jdk8 from Maven Central with nothing else wrong. Two
          # attempts, the second with refreshed dependencies, and the log tail
          # goes out as annotations because job logs are not readable here.
          args=(--no-daemon --stacktrace)
          attempt=1
          while :; do
            if gradle assembleRelease "${args[@]}" > /tmp/gradle.log 2>&1; then
              break
            fi
            if [ "$attempt" -ge 2 ]; then
              { grep -A15 "What went wrong" /tmp/gradle.log | head -30
                grep -nE "error:|undefined reference|FAILED|Could not resolve|not found" /tmp/gradle.log | head -25
              } | while IFS= read -r line; do echo "::error title=gradle::${line//\%/%25}"; done
              exit 1
            fi
            echo "::warning title=gradle::attempt $attempt failed; retrying with refreshed dependencies"
            attempt=$((attempt + 1))
            args+=(--refresh-dependencies)
            sleep 10
          done
          tail -12 /tmp/gradle.log
          echo "::notice title=gradle::assembleRelease succeeded on attempt $attempt"
      - name: Collect the APK
        run: |
          set -e
          APK=$(find android -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error title=apk::gradle produced no APK"; exit 1; }
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp "$APK" "dist/umbra-${TAG#v}-arm64.apk"
          (cd dist && sha256sum *.apk | tee SHA256SUMS)
          file "dist/umbra-${TAG#v}-arm64.apk" || true
          echo "::notice title=apk::$(cd dist && sha256sum *.apk)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*

  pc-linux:
    name: Linux x64 binary for the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned Goose compiler
        run: tools/pin_goose.sh
      - name: Build and run the self-test
        run: |
          set -o pipefail
          mkdir -p dist
          GOOSE=build/bin/goose CC=gcc OUT=build/pc/umbra_headless tools/build_pc.sh | tee pc-selftest.txt
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp build/pc/umbra_headless "dist/umbra-${TAG#v}-linux-x64"
          chmod +x dist/*
          (cd dist && sha256sum * | tee SHA256SUMS)
          echo "::notice title=linux-x64::$(cd dist && sha256sum * | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-pc-linux
          path: dist/*

  pc-windows:
    # The same commands the `pc` workflow runs, on a Windows runner: the released
    # .exe is one that executed natively, not a cross-compile nobody started.
    name: Windows x64 binary for the release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build and run (MSYS2 UCRT64)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GOOSE_CMAKE_GENERATOR=Ninja
          tools/pin_goose.sh
          GOOSE=build/bin/goose.exe tools/gen_core.sh
          mkdir -p dist
          GOOSE=build/bin/goose.exe CC=gcc OUT=build/pc/umbra_headless.exe tools/build_pc.sh | tee pc-selftest.txt
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp build/pc/umbra_headless.exe "dist/umbra-${TAG#v}-windows-x64.exe"
          (cd dist && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-pc-windows
          path: dist/*

  publish-and-verify:
    name: Publish, then download every asset again and check it
    needs: [apk, pc-linux, pc-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Collect the assets
        run: |
          set -e
          mkdir -p dist
          cp assets/release-apk/* dist/
          cp assets/release-pc-linux/* dist/
          cp assets/release-pc-windows/* dist/
          rm -f dist/SHA256SUMS
          ls -l dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Which branch holds this release's evidence: the first remote branch
          # that contains the tag and is not the default branch, else the default
          # branch. Deciding it here keeps a session branch name out of the repo.
          BRANCH=$(git branch -r --contains "$TAG^{commit}" 2>/dev/null \
                   | grep -v 'HEAD' | sed 's|^ *origin/||' \
                   | grep -v "^${{ github.event.repository.default_branch }}$" | head -1)
          [ -n "$BRANCH" ] || BRANCH="${{ github.event.repository.default_branch }}"
          echo "EVIDENCE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "evidence branch: $BRANCH"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES=/tmp/notes.md
          {
            echo "Umbra $TAG — a pre-release. It installs on a phone and draws a world;"
            echo "it is not Minecraft and it cannot open a world yet."
            echo
            sed 's/^/  /' docs/PHONE_TEST.md | sed 's/^  //'
            echo
            echo "Built by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "$NOTES"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release that already exists is added to, never replaced: a working
            # download must never be swapped for a broken one.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Umbra $TAG (pre-release)" \
              --notes-file "$NOTES" \
              --prerelease
          fi
      - name: Verify by downloading every asset from its public URL
        run: |
          set -uo pipefail
          FAILED=0
          OUT=RELEASE_VERIFY.txt
          {
            echo "release verification"
            echo "tag: $TAG"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > "$OUT"
          while IFS= read -r line; do
            SUM=$(echo "$line" | cut -d' ' -f1)
            NAME=$(echo "$line" | cut -d' ' -f2- | sed 's/^\*//')
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$NAME"
            CODE=$(curl -sSL -o "/tmp/dl-$NAME" -w '%{http_code}' "$URL" || echo 000)
            GOT=$(sha256sum "/tmp/dl-$NAME" 2>/dev/null | cut -d' ' -f1)
            SIZE=$(stat -c%s "/tmp/dl-$NAME" 2>/dev/null || echo 0)
            if [ "$CODE" = "200" ] && [ "$GOT" = "$SUM" ]; then
              RESULT="OK"
            else
              RESULT="MISMATCH"
              FAILED=1
            fi
            {
              echo "asset: $NAME"
              echo "  url: $URL"
              echo "  http: $CODE"
              echo "  size: $SIZE bytes"
              echo "  sha256: $GOT"
              echo "  expected: $SUM"
              echo "  result: $RESULT"
            } | tee -a "$OUT"
            echo "::notice title=verify-$NAME::$RESULT http $CODE sha256 $GOT ($SIZE bytes)"
          done < dist/SHA256SUMS
          {
            echo
            if [ "$FAILED" = 0 ]; then
              echo "RESULT: PASS - every asset was re-downloaded and matched"
            else
              echo "RESULT: FAIL - at least one asset did not match"
            fi
          } | tee -a "$OUT"
          exit "$FAILED"
      - name: Run the binaries that were just downloaded
        run: |
          set -uo pipefail
          OUT=RELEASE_VERIFY.txt
          FAILED=0
          LINUX=$(ls /tmp/dl-*-linux-x64 2>/dev/null | head -1)
          WIN=$(ls /tmp/dl-*-windows-x64.exe 2>/dev/null | head -1)
          if [ -n "$LINUX" ]; then
            chmod +x "$LINUX"
            "$LINUX" > /tmp/linux-run.log 2>&1 || true
            if grep -qE "PASS: [0-9]+ checks, 0 failures" /tmp/linux-run.log; then
              echo "linux: the downloaded binary passed its self-test" | tee -a "$OUT"
            else
              echo "linux: the downloaded binary FAILED" | tee -a "$OUT"
              tail -5 /tmp/linux-run.log | tee -a "$OUT"
              FAILED=1
            fi
          else
            echo "linux: no downloaded binary to run" | tee -a "$OUT"; FAILED=1
          fi
          if [ -n "$WIN" ]; then
            # Wine is a coarse stand-in for Windows, but it is execution: a
            # binary that does not start under wine is not a Windows binary.
            sudo apt-get install -y -qq wine64 >/dev/null 2>&1 || sudo apt-get install -y -qq wine >/dev/null 2>&1 || true
            WINE=$(command -v wine64 || command -v wine || true)
            if [ -n "$WINE" ]; then
              "$WINE" "$WIN" > /tmp/wine.log 2>&1 || true
              if grep -qE "PASS: [0-9]+ checks, 0 failures" /tmp/wine.log; then
                echo "windows: the downloaded .exe ran under wine and passed its self-test" | tee -a "$OUT"
              else
                echo "windows: the downloaded .exe did not pass under wine" | tee -a "$OUT"
                tail -5 /tmp/wine.log | tee -a "$OUT"
                FAILED=1
              fi
            else
              echo "windows: wine is unavailable, so the .exe is unproven" | tee -a "$OUT"
              FAILED=1
            fi
          else
            echo "windows: no downloaded .exe to run" | tee -a "$OUT"; FAILED=1
          fi
          exit "$FAILED"

      - name: Commit the verification to the branch that holds this release
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/release
          cp RELEASE_VERIFY.txt "evidence/release/${TAG}.txt" 2>/dev/null || true
          git add -f RELEASE_VERIFY.txt evidence/release
          REQUIRE_EVIDENCE=1 bash tools/commit_evidence.sh "ci: release verification for $TAG from run $GITHUB_RUN_ID [skip ci]" "$EVIDENCE_BRANCH"
